specVersion: "3.1"
metadata:
  name: com.taqa.travelreports.ztravelreports
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /v2/taqa-srv/
            url: https://industrialization---energy-service-co---taqa--taqa-dev-7986ec0d.cfapps.eu10-004.hana.ondemand.com
            destination: TAQA_BTP
            authenticationType: OAuth2UserTokenExchange
          - path: /odata
            url: https://api2preview.sapsf.eu/odata/v2/
            destination: SF
            authenticationType: BasicAuthentication
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /v2/taqa-srv
            generateMockData: true
            metadataXmlPath: ./webapp/localService/mainService/metadata.xml
            mockdataRootPath: ./webapp/localService/data
          - urlPath: /odata/v2
            generateMockData: true
            metadataXmlPath: ./webapp/localService/v2/metadata.xml
            mockdataRootPath: ./webapp/localService/v2/mockdata
          - urlPath: /v2/taqa-srv/
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/mockdata
            generateMockData: true
        annotations: []
